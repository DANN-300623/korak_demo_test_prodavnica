<!doctype html>
<html lang="sr-Latn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Korak – administracija</title>
  <meta name="theme-color" content="#1f4a3a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2318201d'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='Arial' font-weight='700' font-size='19' fill='%23e2a534'%3EK%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <!-- Prijava -->
  <main id="login-screen" class="login" hidden>
    <form id="login-form" class="login-card" novalidate>
      <p class="brand">Korak <span>administracija</span></p>
      <h1>Prijava</h1>
      <label for="password">Lozinka</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <p id="login-msg" class="msg" role="alert"></p>
      <button class="btn btn-primary btn-block" type="submit" id="login-btn">Prijavi se</button>
      <p class="muted small">Lozinka se ispisuje u Apps Script logu pri prvom pokretanju funkcije setup().</p>
    </form>
  </main>

  <!-- Panel -->
  <div id="app" hidden>
    <header class="topbar">
      <div class="topbar-inner">
        <p class="brand">Korak <span>administracija</span></p>
        <nav class="tabs" role="tablist" aria-label="Sekcije">
          <button role="tab" data-tab="orders" id="tab-orders">Porudžbine <span class="tab-n" id="n-orders"></span></button>
          <button role="tab" data-tab="products" id="tab-products">Proizvodi</button>
          <button role="tab" data-tab="stock" id="tab-stock">Stanje <span class="tab-n tab-n-warn" id="n-stock"></span></button>
        </nav>
        <div class="topbar-actions">
          <a class="btn btn-ghost" href="../" target="_blank" rel="noopener">Prodavnica</a>
          <button class="btn btn-ghost" id="reload-btn" title="Ponovo učitaj sve podatke sa servera">Osveži</button>
          <button class="btn btn-ghost" id="logout-btn">Odjavi se</button>
        </div>
      </div>
    </header>
    <main class="wrap" id="panel" tabindex="-1"></main>
  </div>

  <dialog id="dlg" aria-labelledby="dlg-title"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="admin.js"></script>
</body>
</html>
